name: screens

# The demo images, from the golden screen fixtures, on request and for every release. Nothing here
# reaches a model: the frames come from the fakes the tests use.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install freeze
        run: go install github.com/charmbracelet/freeze@latest
      - name: Draw the screens
        run: sh scripts/screens.sh dist/screens
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: dist/screens
