name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Keyless signing and build provenance both prove who built a release with the workflow's OIDC
  # token; neither needs a stored key.
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser reads the tag history to compute the version and to build the changelog
          # from the commits since the previous tag. A shallow checkout only has the commit the
          # tag points at, which leaves GoReleaser with no prior tag to diff against.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Without the app id a release still builds and ships; only Copilot sign-in is unavailable in
      # it, and it says so in words when somebody tries. Blocking every release on one route's
      # registration held back fixes that have nothing to do with it.
      - name: Note whether the Canopy GitHub app is registered
        env:
          CANOPY_GITHUB_CLIENT_ID: ${{ vars.CANOPY_GITHUB_CLIENT_ID }}
        run: |
          if [ -z "$CANOPY_GITHUB_CLIENT_ID" ]; then
            echo "::warning::CANOPY_GITHUB_CLIENT_ID is not set, so this release cannot sign in to GitHub Copilot."
          fi

      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANOPY_GITHUB_CLIENT_ID: ${{ vars.CANOPY_GITHUB_CLIENT_ID }}
          # Only needed once a tag without a hyphen is pushed, since the cask is skipped on
          # prereleases. Empty until the tap repository and the token exist, which is fine.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # SLSA build provenance for every archive and the checksum file, recorded with GitHub's
      # attestation store: `gh attestation verify <archive> --repo Walid-Idrissi-Labs/Canopy` checks
      # that a download was built here, from which commit, by this workflow.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
