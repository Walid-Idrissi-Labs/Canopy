# GoReleaser v2 configuration for Canopy.
#
# Run locally with `make snapshot` (build only, no publish, no tag required). A real release
# happens from .github/workflows/release.yml on a pushed `v*` tag, which needs GITHUB_TOKEN and
# a full clone, since GoReleaser reads tags to compute the version and the changelog.
version: 2

project_name: canopy

before:
  hooks:
    - go mod tidy

builds:
  - id: canopy
    main: ./cmd/canopy
    binary: canopy
    # Windows is intentionally not built. Canopy manages agent subprocesses through unix process
    # groups (setpgid, killing the group rather than one pid) to stop a whole agent's work
    # including anything it spawned, and there is no Windows equivalent wired up, only job
    # objects would approximate it and that has not been designed. See README.md, "What it will
    # not do".
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      # No cgo dependency exists today, and a CGO_ENABLED=0 binary is a static one: nothing to
      # link against at the other end, which is one less way an install can fail on a machine
      # that never had a Go toolchain on it.
      - CGO_ENABLED=0
    flags:
      # Build paths baked into the binary are only useful to whoever built it, and only until the
      # next release makes them stale. Trimming them means two builds of the same commit produce
      # the same binary regardless of whose machine or CI runner did the building.
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: canopy
    ids:
      - canopy
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  # Not a prerelease, and the latest release, from the beta onwards.
  #
  # This was `auto`, which marks any tag carrying a suffix as a GitHub prerelease. That was right
  # while the tags were alphas: a build the two of us were trying is not something to put in front of
  # a visitor as the current version. It became wrong the moment the point of a tag was that somebody
  # else installs it, because **GitHub refuses to call a prerelease the latest release**. It says so
  # in as many words if you try: "Latest release cannot be draft or prerelease." With every release
  # flagged, the repository had no latest release at all and the API answered 404, so the release
  # page and every install instruction that resolves "latest" pointed at nothing.
  #
  # The maturity signal did not move, it just stopped being carried by this flag. It is in the tag
  # name, `v0.1.0-beta.1`, which is the first thing anybody reads; in the README's status line and the
  # paragraph under it saying the phase gates are unsigned; and in LIMITATIONS. A flag that hides the
  # release is not honesty, it is only invisibility.
  #
  # If an alpha is ever cut again, set this back to `auto` for that tag. The suffix alone will not do
  # it any more, which is the cost of this change and is worth stating rather than discovering.
  #
  # Independent of the Homebrew cask, which is the mechanism people confuse this with. That one reads
  # the parsed version directly, not this flag, so a `-beta` tag still skips the tap. The alpha.3 run
  # proved the two are separate: it logged "prerelease detected with 'auto' upload, skipping homebrew
  # publish" while the GitHub release itself was labelled stable.
  prerelease: false
  make_latest: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Performance"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other changes
      order: 999

# The Homebrew tap.
#
# skip_upload: auto is what makes this safe to leave switched on. GoReleaser treats a tag containing
# a hyphen as a prerelease, so v0.1.0-alpha.1 builds and publishes the GitHub release and does not
# touch the tap at all. The first tag without a hyphen is what pushes a cask, which is the right
# moment: a formula for a version that changes next week costs more than it earns.
#
# A cask rather than a formula because GoReleaser deprecated `brews` in favour of `homebrew_casks`.
# The cost is real and worth knowing: casks are macOS only, so Linux users install with `go install`
# or from the release archive rather than through Homebrew.
#
# HOMEBREW_TAP_TOKEN has to be a personal access token with contents write on the tap repository.
# The workflow's own GITHUB_TOKEN cannot write to a different repository, which is the failure that
# looks like a permissions bug and is not.
homebrew_casks:
  - name: canopy
    repository:
      owner: Walid-Idrissi-Labs
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    skip_upload: auto
    homepage: "https://github.com/Walid-Idrissi-Labs/Canopy"
    description: "A terminal coding agent for running several agents at once"
    hooks:
      post:
        install: |
          # The binary is not signed or notarised, so macOS quarantines anything downloaded through
          # a cask and kills it on first run with a message about the developer being unverified.
          # Removing the attribute is what every unsigned cask does. Signing it properly needs an
          # Apple Developer account, which is a decision rather than an oversight.
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/canopy"]
          end
