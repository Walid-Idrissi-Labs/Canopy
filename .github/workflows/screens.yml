name: screens

# The demo images, from the golden screen fixtures, on request and for every release. Nothing here
# reaches a model: the frames come from the fakes the tests use.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install freeze
        run: go install github.com/charmbracelet/freeze@v0.2.2
      - name: Draw the screens
        run: sh scripts/screens.sh dist/screens
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screens
          path: dist/screens
