name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser reads the tag history to compute the version and to build the changelog
          # from the commits since the previous tag. A shallow checkout only has the commit the
          # tag points at, which leaves GoReleaser with no prior tag to diff against.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Require the Canopy GitHub app registration
        env:
          CANOPY_GITHUB_CLIENT_ID: ${{ vars.CANOPY_GITHUB_CLIENT_ID }}
        run: |
          if [ -z "$CANOPY_GITHUB_CLIENT_ID" ]; then
            echo "Set the public repository variable CANOPY_GITHUB_CLIENT_ID before releasing." >&2
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANOPY_GITHUB_CLIENT_ID: ${{ vars.CANOPY_GITHUB_CLIENT_ID }}
          # Only needed once a tag without a hyphen is pushed, since the cask is skipped on
          # prereleases. Empty until the tap repository and the token exist, which is fine.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
